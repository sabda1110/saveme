<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald Fintech Gradient -->
    <linearGradient id="emBadge512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Bevel Stroke Gradient -->
    <linearGradient id="emStroke512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#059669" flood-opacity="0.3"/>
    </filter>

    <!-- Coin Glow Filter -->
    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#emBadge512)" stroke="url(#emStroke512)" stroke-width="12" filter="url(#badgeShadow)"/>

  <!-- Centered Scaled Modern Piggy Bank -->
  <g transform="translate(68, 64) scale(7.8)">
    <!-- Dropping Coin with Glow -->
    <g filter="url(#coinGlow)">
      <circle cx="24" cy="8" r="4.5" fill="#ffffff" />
      <circle cx="24" cy="8" r="2.8" stroke="#10b981" stroke-width="0.8" fill="#ecfdf5" />
      <path d="M 24 5.8 V 10.2 M 22 7.2 H 26" stroke="#059669" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- Coin Drop Motion Rays -->
    <path d="M 18 9 L 19 11 M 30 9 L 29 11" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

    <!-- Piggy Bank Body -->
    <path
      d="M 21 15 C 14.5 15 9.5 19.5 8 25 C 7 28.5 7.8 32.5 10.5 35.5 L 10.5 39 C 10.5 40.1 11.4 41 12.5 41 C 13.6 41 14.5 40.1 14.5 39 L 14.5 37 C 17.5 37.8 21.5 37.8 24.5 37 L 24.5 39 C 24.5 40.1 25.4 41 26.5 41 C 27.6 41 28.5 40.1 28.5 39 L 28.5 35 C 31 33.5 32.8 31 33.8 28.5 C 35.2 28.8 37.2 28.8 38.8 27.6 C 40 26.6 40.8 24.8 40.8 22.5 C 40.8 20.5 39.8 19.2 38.2 18.2 C 37.2 15.5 34.8 14 31.5 13.6 L 32.5 9.8 C 32.8 8.8 32.2 7.8 31.2 7.5 C 30.2 7.2 29.2 7.8 28.9 8.8 L 27.8 13.2 C 25.5 13 23 13 21 15 Z"
      fill="#ffffff"
    />

    <!-- Coin Slot Cutout -->
    <rect x="20" y="14" width="7" height="1.8" rx="0.9" fill="#047857" />

    <!-- Ear Fold Cutout -->
    <path d="M 29 14.5 C 30.5 16.5 32.5 17.8 34.5 17.8" stroke="#047857" stroke-width="1.5" stroke-linecap="round" />

    <!-- Sleek Eye Dot -->
    <circle cx="33.5" cy="22" r="1.3" fill="#047857" />

    <!-- Snout Nostril -->
    <circle cx="38.5" cy="23.5" r="1" fill="#047857" />

    <!-- Tail Curl -->
    <path d="M 8 27 C 5.5 27 4.2 25 5 23 C 5.8 21.5 7.5 22 8 23.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>