<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald Fintech Gradient -->
    <linearGradient id="emBadge512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Bevel Stroke Gradient -->
    <linearGradient id="emStroke512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#emBadge512)" stroke="url(#emStroke512)" stroke-width="12" filter="url(#badgeShadow)"/>

  <!-- Geometric S-Vault Ribbon (Pure White) -->
  <path 
    d="M 350 150 C 350 150, 220 120, 170 180 C 120 240, 140 300, 220 320 L 280 340 C 360 360, 380 420, 330 470 C 280 520, 160 500, 160 500" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="48" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    transform="scale(0.72) translate(100, 25)"
  />

  <!-- Central Diamond Core -->
  <polygon 
    points="256,206 306,256 256,306 206,256" 
    fill="#ffffff" 
  />

  <!-- Growth Arrow Tip -->
  <path 
    d="M 290 120 L 370 120 L 370 200" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="46" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    transform="scale(0.82) translate(55, 18)"
  />
</svg>
